[package]
name = "grok-dynamic-models"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Dynamic model discovery for Grok Build — fetches models from any OpenAI-compatible API server at startup"

[dependencies]
xai-grok-extension-api = { path = "../../crates/common/xai-grok-extension-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
dirs = "5"
tracing = "0.1"
ctor = "0.2"
